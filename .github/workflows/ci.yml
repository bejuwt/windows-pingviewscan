name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build PingViewScan.slnx -c Release

      # Loads every WPF tab and the main window on a real Windows host, so a
      # XAML or view-model startup crash fails CI instead of shipping a binary
      # that silently does nothing when double-clicked.
      - name: Smoke-test published app (WPF startup self-test)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "app-publish"
          dotnet publish src/PingViewScan.App/PingViewScan.App.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $out
          $exe = Join-Path $out "PingViewScan.App.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA "PingViewScan\logs\startup.log"
          if (Test-Path $log) { Get-Content $log }
          if ($process.ExitCode -ne 0) {
            throw "WPF startup self-test failed (exit code $($process.ExitCode))"
          }
          Write-Host "WPF startup self-test OK"

      - name: Smoke-test CLI (scan + report)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "scan.html"
          dotnet run --project src/PingViewScan.Cli -c Release -- --scan 127.0.0.1 --ports 135,445 --report $report
          if (-not (Test-Path $report)) { throw "Scan report was not produced" }
          if ((Get-Item $report).Length -lt 100) { throw "Scan report looks empty" }
          Write-Host "Report OK: $report"

      - name: Smoke-test CLI (traceroute + subnet)
        shell: pwsh
        run: |
          $trace = Join-Path $env:RUNNER_TEMP "trace.html"
          dotnet run --project src/PingViewScan.Cli -c Release -- --trace 127.0.0.1 --max-hops 3 --queries 1 --trace-timeout 1 --report $trace
          if (-not (Test-Path $trace)) { throw "Trace report was not produced" }
          if ((Get-Item $trace).Length -lt 100) { throw "Trace report looks empty" }
          $subnet = dotnet run --project src/PingViewScan.Cli -c Release -- --subnet 192.168.1.10/24
          if (-not ($subnet -match "192\.168\.1\.0/24")) { throw "Unexpected subnet output: $subnet" }
          Write-Host "Trace report OK: $trace"
