name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')
          "tag=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # Single-file build: most convenient, but it self-extracts its native
      # libraries to %TEMP% at first launch, which some locked-down machines
      # and antivirus products block. The folder build below always works.
      - name: Publish win-x64 (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish src/PingViewScan.App/PingViewScan.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish/win-x64-singlefile

      - name: Publish win-x64 (self-contained, folder)
        shell: pwsh
        run: |
          dotnet publish src/PingViewScan.App/PingViewScan.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish/win-x64

      - name: Smoke-test published app (WPF startup self-test)
        shell: pwsh
        run: |
          $exe = "publish/win-x64/PingViewScan.App.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA "PingViewScan\logs\startup.log"
          if (Test-Path $log) { Get-Content $log }
          if ($process.ExitCode -ne 0) {
            throw "WPF startup self-test failed (exit code $($process.ExitCode))"
          }
          Write-Host "WPF startup self-test OK"

      - name: Package zip
        shell: pwsh
        run: |
          $src = "publish/win-x64"
          Remove-Item "$src/*.pdb" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$src/*" -DestinationPath "PingViewScan-${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PingViewScan ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            publish/win-x64-singlefile/PingViewScan.App.exe
            PingViewScan-${{ steps.ver.outputs.version }}-win-x64.zip
